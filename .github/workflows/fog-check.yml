name: Fog check

# Started every evening at 20:00 by cron-job.org.
# GitHub's own schedule ran hours late, so it isn't used.
on:
  workflow_dispatch:
    inputs:
      always_notify:
        description: 'Send a notification even if no fog is forecast (for testing)'
        type: boolean
        default: false

permissions:
  contents: write  # to save history.csv (forecast vs. what was observed)

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 fog_check.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALWAYS_NOTIFY: ${{ inputs.always_notify }}
      - name: Save history
        run: |
          [ -f history.csv ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.csv
          git diff --cached --quiet || git commit -m "Fog history $(date +%F)"
          git push
